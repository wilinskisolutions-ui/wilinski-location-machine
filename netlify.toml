# Netlify must not build this repository itself.
#
# The site needs the data pipeline first (about a gigabyte of downloads, then Python),
# which runs in GitHub Actions (.github/workflows/web.yml). That workflow tests everything
# and pushes the finished site to the `site` branch, which is what Netlify publishes
# (Production branch: site; that branch carries its own netlify.toml, from
# web/netlify.site.toml). This file only matters for any other branch Netlify sees: pull
# request previews, or `main` if the production branch is ever set back to it. Left to
# its own devices, Netlify publishes this repository as it is, which has no index.html at
# the root, and replaces the live site with "Page not found" (2026-10-17).
#
# `ignore` exiting 0 cancels those builds. A deploy started by hand in Netlify skips
# `ignore`, then stops at the missing web/dist: it fails without touching the live site.
[build]
  ignore = "exit 0"
  publish = "web/dist"
