# Indicator registry — the single source of truth for scoring.
# Nothing is scored that is not registered here (docs/methodology.md §2).
#
# curve:  higher_better | lower_better  -> applied to the NATIONAL PERCENTILE of the value
#         ideal_band | ideal_point      -> applied to the RAW value, in the unit given
#         (this distinction is load-bearing; see docs/methodology.md §3)
#
# provisional: true  -> curve params are placeholders awaiting the Phase 3 questionnaire.
#         The pipeline runs with them; the household replaces them. Flagged so no one
#         mistakes a typed-in default for an elicited preference (Principle 7).
#
# This is a SEED set proving the schema end to end across all ten scoring domains.
# Phase 2 expands it to 40-60 indicators.

indicators:

  # ---------------- cost_housing ----------------
  - id: cost_home_value_median
    domain: cost_housing
    label: Median home value (Zillow ZHVI)
    source: zillow_research
    geo_level: county
    curve: lower_better
    direction: universal
    unit: USD
    notes: Zillow's county file, which joins directly without a metro crosswalk.

  - id: cost_rent_median_zori
    domain: cost_housing
    label: Median asking rent (Zillow ZORI)
    source: zillow_research
    geo_level: county
    curve: lower_better
    direction: universal
    unit: USD/month
    notes: >
      Replaces the HUD Fair Market Rent indicator, whose download returns 202 with an empty
      body. Zillow measures asking rents rather than HUD's payment standard, so it is a
      different quantity — closer to what a mover would actually pay.


  - id: cost_price_parity
    domain: cost_housing
    label: Regional price parity, all items
    source: bea_rpp
    geo_level: county
    crosswalk_from: metro
    curve: lower_better
    direction: universal
    unit: index
    notes: >
      Published per metro area; carried onto counties via the CBSA delineation file.
      Counties outside any metro have no RPP and stay missing — assigning them the national
      average would flatter rural places on the very dimension being measured.

  - id: cost_property_tax_rate
    domain: cost_housing
    label: Median property tax as share of home value
    source: census_acs5
    geo_level: county
    curve: lower_better
    direction: universal
    unit: ratio

  - id: cost_electricity_price
    domain: cost_housing
    label: Average residential electricity price
    source: eia_electricity
    geo_level: state
    curve: lower_better
    direction: universal
    unit: cents/kWh

  - id: cost_income_to_home_ratio
    domain: cost_housing
    label: Median home value divided by median household income
    source: census_acs5
    geo_level: place
    curve: lower_better
    direction: universal
    unit: ratio
    notes: Affordability relative to local wages, not absolute price.

  # ---------------- climate_environment ----------------
  # NOAA's annual/seasonal normals product is SEASONAL, not monthly. These are named for
  # what the data actually is. Harrisburg reads winter 34.7F / summer 75.3F, which is the
  # household's baseline to improve on.
  - id: climate_temp_winter_mean
    domain: climate_environment
    label: Mean winter temperature (Dec-Feb)
    source: noaa_normals
    geo_level: county
    curve: ideal_band
    direction: personal
    curve_params: {lo: 40, hi: 62, shoulder: 12, shoulder_lo: 8}
    unit: degF
    provisional: true
    notes: >
      The household wants warmer than Harrisburg's 34.7F. Tighter lower shoulder because
      colder is the thing being escaped; the upper shoulder is looser since a mild winter
      is rarely a complaint.

  - id: climate_temp_summer_mean
    domain: climate_environment
    label: Mean summer temperature (Jun-Aug)
    source: noaa_normals
    geo_level: county
    curve: ideal_band
    direction: personal
    curve_params: {lo: 68, hi: 80, shoulder: 8}
    unit: degF
    provisional: true

  - id: climate_winter_low
    domain: climate_environment
    label: Mean winter daily low (Dec-Feb)
    source: noaa_normals
    geo_level: county
    curve: ideal_band
    direction: personal
    curve_params: {lo: 30, hi: 55, shoulder: 12, shoulder_lo: 8}
    unit: degF
    provisional: true

  - id: climate_summer_high
    domain: climate_environment
    label: Mean summer daily high (Jun-Aug)
    source: noaa_normals
    geo_level: county
    curve: ideal_band
    direction: personal
    curve_params: {lo: 76, hi: 88, shoulder: 8}
    unit: degF
    provisional: true
    notes: >
      The counterweight to "warmer is better". Somewhere with a mild winter and a 100F
      summer is not what the household is asking for.

  - id: climate_heating_degree_days
    domain: climate_environment
    label: Annual heating degree days
    source: noaa_normals
    geo_level: county
    curve: lower_better
    direction: personal
    unit: degree_days
    notes: How much winter actually costs, in energy and in daily life. Harrisburg is 4,756.

  - id: climate_cooling_degree_days
    domain: climate_environment
    label: Annual cooling degree days
    source: noaa_normals
    geo_level: county
    curve: ideal_band
    direction: personal
    curve_params: {lo: 600, hi: 2200, shoulder: 900}
    unit: degree_days
    provisional: true

  - id: climate_annual_precip
    domain: climate_environment
    label: Annual precipitation
    source: noaa_normals
    geo_level: county
    curve: ideal_band
    direction: personal
    curve_params: {lo: 25, hi: 45, shoulder: 12}
    unit: inches
    provisional: true

  - id: climate_annual_snowfall
    domain: climate_environment
    label: Annual snowfall
    source: noaa_normals
    geo_level: county
    curve: ideal_point
    direction: personal
    curve_params: {target: 12, tol: 20}
    unit: inches
    provisional: true

  - id: hazard_nri_composite
    domain: climate_environment
    label: FEMA National Risk Index composite
    source: fema_nri
    geo_level: county
    curve: lower_better
    direction: universal
    unit: score
    notes: 18 hazards as expected annual loss. Decisive for the Florida/Texas question.

  - id: hazard_nri_hurricane
    domain: climate_environment
    label: FEMA NRI hurricane risk
    source: fema_nri
    geo_level: county
    curve: lower_better
    direction: universal
    unit: score

  - id: hazard_nri_wildfire
    domain: climate_environment
    label: FEMA NRI wildfire risk
    source: fema_nri
    geo_level: county
    curve: lower_better
    direction: universal
    unit: score

  # Added because the household wants somewhere warmer. Heat and drought are what "warm"
  # costs inland, exactly as hurricane risk is what it costs on a coast.
  - id: hazard_nri_heatwave
    domain: climate_environment
    label: FEMA NRI heat wave risk
    source: fema_nri
    geo_level: county
    curve: lower_better
    direction: universal
    unit: score

  - id: hazard_nri_drought
    domain: climate_environment
    label: FEMA NRI drought risk
    source: fema_nri
    geo_level: county
    curve: lower_better
    direction: universal
    unit: score

  - id: hazard_nri_tornado
    domain: climate_environment
    label: FEMA NRI tornado risk
    source: fema_nri
    geo_level: county
    curve: lower_better
    direction: universal
    unit: score

  - id: hazard_fatality_risk_per100k
    domain: climate_environment
    label: Expected annual hazard fatalities per 100,000 residents
    source: fema_nri
    geo_level: county
    curve: lower_better
    direction: universal
    unit: per100k
    notes: >
      Summed expected annual loss of life across hazards, divided by population. The
      indicators above are FEMA's official percentiles, which rank expected annual *loss* —
      and loss scales with how much property a county contains, so Los Angeles scores 100
      partly for being Los Angeles. Used alone that would penalise populous places for
      having a lot to lose, working against this household's amenity preference for reasons
      unrelated to their safety. This one is exposure-normalised: the risk to a person.

  - id: env_pm25_annual
    domain: climate_environment
    label: Annual mean PM2.5
    source: epa_aqs
    geo_level: county
    curve: lower_better
    direction: universal
    unit: ug/m3

  - id: env_natural_amenities
    domain: climate_environment
    label: USDA natural amenities scale
    source: usda_amenities
    geo_level: county
    curve: higher_better
    direction: universal
    unit: index
    notes: 1999 vintage but structural — terrain and water area, not time-varying.

  # ---------------- urban_form ----------------
  - id: form_population
    domain: urban_form
    label: Place population
    source: census_acs5
    geo_level: place
    curve: ideal_band
    direction: personal
    curve_params: {lo: 25000, hi: 250000, shoulder: 50000, shoulder_lo: 8000}
    unit: people
    provisional: true
    notes: >
      The canonical band case — a percentile would rank a 4M-person county above the ideal
      town. `shoulder_lo` is much tighter than the upper shoulder because population is
      effectively logarithmic: a symmetric shoulder scores a 500-person village 0.51, which
      is not what "too small" means.

  - id: form_population_density
    domain: urban_form
    label: Population per square mile
    source: census_acs5
    geo_level: place
    curve: ideal_band
    direction: personal
    curve_params: {lo: 1500, hi: 6000, shoulder: 2000}
    unit: people/sqmi
    transform: log
    provisional: true
    notes: >
      Derived: ACS population over Gazetteer land area, which the universe table already
      carries. Sourced to ACS because that is where the numerator comes from — the
      Gazetteer files contain geography only and no population at all.

  - id: form_mean_commute
    domain: urban_form
    label: Mean travel time to work
    source: census_acs5
    geo_level: place
    curve: lower_better
    direction: universal
    unit: minutes

  - id: form_transit_ridership_pc
    domain: urban_form
    label: Transit trips per capita
    source: fta_ntd
    geo_level: metro
    curve: higher_better
    direction: universal
    unit: trips/person/year

  # Built to TEST the household's assumption that European access requires the east coast,
  # rather than to encode it. See docs/data-sources.md.
  - id: air_europe_destinations
    domain: urban_form
    label: Nonstop European destinations from the nearest transatlantic airport
    source: bts_intl
    geo_level: county
    curve: higher_better
    direction: universal
    unit: count

  - id: air_europe_hub_distance
    domain: urban_form
    label: Distance to the nearest airport with European nonstops
    source: bts_intl
    geo_level: county
    curve: lower_better
    direction: universal
    unit: miles

  - id: air_europe_passengers
    domain: urban_form
    label: Annual transatlantic passengers at the nearest such airport
    source: bts_intl
    geo_level: county
    curve: higher_better
    direction: universal
    unit: passengers/year
    notes: Volume proxies for fare competition — more traffic generally means cheaper seats.

  - id: form_broadband_gigabit
    domain: urban_form
    label: Share of households with gigabit service available
    source: fcc_broadband
    geo_level: county
    curve: higher_better
    direction: universal
    unit: share

  # ---------------- career_economy ----------------
  - id: econ_unemployment_rate
    domain: career_economy
    label: Unemployment rate
    source: chr_rwjf
    geo_level: county
    notes: >
      Sourced from County Health Rankings, which republishes the BLS county series. Saves a
      separate LAUS ingest for the same underlying numbers.
    curve: lower_better
    direction: universal
    unit: percent

  - id: econ_median_wage
    domain: career_economy
    label: Median annual wage, all occupations
    source: bls_oes
    geo_level: metro
    curve: higher_better
    direction: universal
    unit: USD

  - id: econ_industry_diversity
    domain: career_economy
    label: Industry diversity (inverse Herfindahl of employment by sector)
    source: bls_qcew
    geo_level: county
    curve: higher_better
    direction: universal
    unit: index
    notes: Proxy for resilience — how exposed the place is if one sector contracts.

  - id: econ_employment_growth_5y
    domain: career_economy
    label: Five-year employment growth
    source: bls_qcew
    geo_level: county
    curve: higher_better
    direction: universal
    unit: percent

  # ---------------- education ----------------
  # Split out of the former `family_services` on 2026-08-22 so schools and childcare can
  # carry independent weights.
  #
  # `crosswalk_from: district` records that SEDA publishes at school-district level, which
  # does not nest inside counties — NCES EDGE relationship files carry it onto the universe.
  # Declared here so the derivation is visible in the registry, not buried in ingest code.

  - id: edu_learning_rate
    domain: education
    label: Learning rate (grade-level growth per year, SEDA)
    source: seda_stanford
    geo_level: county
    crosswalk_from: district
    curve: higher_better
    direction: universal
    unit: grade_levels/year
    notes: >
      The load-bearing education indicator. Measures how much students improve, which is
      far less confounded by family income than raw achievement — it scores what the
      schools do rather than who attends them.

  - id: edu_achievement_level
    domain: education
    label: Average achievement level (SEDA)
    source: seda_stanford
    geo_level: county
    crosswalk_from: district
    curve: higher_better
    direction: universal
    unit: grade_levels
    notes: >
      Registered alongside learning rate deliberately, NOT as a substitute. Correlates
      heavily with local family income, so on its own it largely measures neighbourhood
      wealth. Its value is the disagreement: low achievement with high growth is a very
      different place from the reverse.

  - id: edu_spend_per_pupil
    domain: education
    label: Current expenditure per pupil
    source: urban_educationdata
    geo_level: county
    curve: higher_better
    direction: universal
    unit: USD
    quality: substitute
    quality_note: >
      CCD current elementary/secondary expenditure over enrolment. SUBSTITUTE for SEDA
      learning growth, and the most income-confounded of the four: spending tracks the local
      tax base, so it partly re-measures the cost domain.

  - id: edu_student_teacher_ratio
    domain: education
    label: Student-teacher ratio
    source: urban_educationdata
    geo_level: county
    curve: lower_better
    direction: universal
    unit: ratio
    quality: substitute
    quality_note: >
      CCD enrollment over teacher FTE. SUBSTITUTE for SEDA learning growth: an input measure,
      which says what a district buys rather than what its pupils gain.

  - id: edu_graduation_rate
    domain: education
    label: Adjusted cohort graduation rate
    source: urban_educationdata
    geo_level: county
    curve: higher_better
    direction: universal
    unit: share
    quality: substitute
    quality_note: >
      EDFacts adjusted-cohort rate, cohort-weighted from districts to county. SUBSTITUTE for
      SEDA learning growth: an outcome measure, so more income-confounded than growth.
      Published as a binned range for small cohorts; bins wider than 20 points are dropped.

  - id: edu_district_choice_count
    domain: education
    label: Number of school districts serving the area
    source: urban_educationdata
    geo_level: county
    curve: higher_better
    direction: universal
    unit: count
    notes: Proxy for school choice without moving house.
    quality: substitute
    quality_note: >
      Districts with pupils in the county. SUBSTITUTE, and the weakest: choice is not quality.

  # ---------------- family_childcare ----------------
  - id: family_childcare_cost_infant
    domain: family_childcare
    label: Median infant center-based childcare price
    source: dol_childcare
    geo_level: county
    curve: lower_better
    direction: universal
    unit: USD/year

  - id: family_childcare_cost_toddler
    domain: family_childcare
    label: Median toddler center-based childcare price
    source: dol_childcare
    geo_level: county
    curve: lower_better
    direction: universal
    unit: USD/year

  # ---------------- health_care ----------------
  - id: health_life_expectancy
    domain: health_care
    label: Life expectancy at birth
    source: chr_rwjf
    geo_level: county
    curve: higher_better
    direction: universal
    unit: years

  - id: health_pcp_ratio
    domain: health_care
    label: Population per primary care physician
    source: chr_rwjf
    geo_level: county
    curve: lower_better
    direction: universal
    unit: ratio

  - id: health_hpsa_shortage
    domain: health_care
    label: Designated health professional shortage area
    source: hrsa_hpsa
    geo_level: county
    curve: lower_better
    direction: universal
    unit: score

  # ---------------- safety ----------------
  - id: safety_violent_crime_rate
    domain: safety
    label: Violent crime per 100,000
    source: fbi_cde
    geo_level: county
    curve: lower_better
    direction: universal
    unit: per100k
    notes: Agency reporting is voluntary — coverage gaps are flagged, never imputed (Principle 6).

  - id: safety_property_crime_rate
    domain: safety
    label: Property crime per 100,000
    source: fbi_cde
    geo_level: county
    curve: lower_better
    direction: universal
    unit: per100k

  # Broadened from crime-only on 2026-08-22. These come from death certificates and crash
  # records rather than voluntary police reporting, so coverage is near-complete exactly
  # where FBI data has gaps.

  - id: safety_traffic_fatality_rate
    domain: safety
    label: Motor vehicle fatalities per 100,000
    source: nhtsa_fars
    geo_level: county
    curve: lower_better
    direction: universal
    unit: per100k
    notes: >
      Per-capita road death rates run several times higher in rural counties than dense
      metros and frequently exceed the absolute risk difference from crime. Almost no
      relocation research counts it.

  - id: safety_overdose_death_rate
    domain: safety
    label: Drug overdose deaths per 100,000
    source: cdc_wonder
    geo_level: county
    curve: lower_better
    direction: universal
    unit: per100k
    notes: CDC WONDER suppresses county cells under 10 deaths — flag, never read as zero.

  - id: safety_firearm_death_rate
    domain: safety
    label: Firearm deaths per 100,000
    source: cdc_wonder
    geo_level: county
    curve: lower_better
    direction: universal
    unit: per100k
    notes: All manners of death combined; suppression caveat as above.

  # ---------------- recreation_lifestyle ----------------
  - id: rec_park_access
    domain: recreation_lifestyle
    label: Share of population with park access
    source: chr_rwjf
    geo_level: county
    curve: higher_better
    direction: universal
    unit: share

  # Amenity density comes from County Business Patterns, not OpenStreetMap: Overpass and
  # its mirrors are egress-blocked. CBP is the better source anyway — authoritative
  # establishment counts, complete national coverage, no rate limits, and it covers small
  # counties as thoroughly as large ones, which is a direct countermeasure to coverage bias.
  #
  # "Things to do" is one of the two things pushing this household out of Harrisburg, so
  # this group is deliberately detailed rather than a single blended score.
  - id: amen_food_drink_per10k
    domain: recreation_lifestyle
    label: Restaurants and bars per 10,000 residents
    source: census_cbp
    geo_level: county
    curve: higher_better
    direction: universal
    unit: per10k
    notes: NAICS 722. Dauphin County has 610 establishments, the household's baseline.

  - id: amen_arts_rec_per10k
    domain: recreation_lifestyle
    label: Arts, entertainment and recreation per 10,000 residents
    source: census_cbp
    geo_level: county
    curve: higher_better
    direction: universal
    unit: per10k
    notes: NAICS 71 — venues, museums, sports, parks and recreation businesses.

  - id: amen_food_drink_total
    domain: recreation_lifestyle
    label: Total restaurants and bars
    source: census_cbp
    geo_level: county
    curve: higher_better
    direction: universal
    transform: log
    unit: count
    notes: >
      Variety, as opposed to the per-capita density above. Per-capita alone rewards tourist
      towns: San Juan County CO (population 821) shows 158 restaurants per 10k against
      Manhattan's 57. Both questions are real and they are not the same question.

  - id: amen_arts_rec_total
    domain: recreation_lifestyle
    label: Total arts, entertainment and recreation venues
    source: census_cbp
    geo_level: county
    curve: higher_better
    direction: universal
    transform: log
    unit: count

  - id: amen_grocery_per10k
    domain: recreation_lifestyle
    label: Food and beverage stores per 10,000 residents
    source: census_cbp
    geo_level: county
    curve: higher_better
    direction: universal
    unit: per10k

  - id: amen_fitness_per10k
    domain: recreation_lifestyle
    label: Fitness and recreational sports centres per 10,000 residents
    source: census_cbp
    geo_level: county
    curve: higher_better
    direction: universal
    unit: per10k

  - id: amen_establishments_per10k
    domain: recreation_lifestyle
    label: All business establishments per 10,000 residents
    source: census_cbp
    geo_level: county
    curve: higher_better
    direction: universal
    unit: per10k
    notes: Overall commercial density — the general "is there anything here" measure.

  # ---------------- community_culture ----------------
  - id: comm_median_age
    domain: community_culture
    label: Median age
    source: census_acs5
    geo_level: place
    curve: ideal_band
    direction: personal
    curve_params: {lo: 32, hi: 44, shoulder: 8}
    unit: years
    provisional: true

  - id: comm_same_house_1yr
    domain: community_culture
    label: Share in the same house one year ago
    source: census_acs5
    geo_level: place
    curve: higher_better
    direction: personal
    unit: share
    notes: Rootedness vs. transience. Direction is provisional — some households want churn.
    provisional: true

  - id: comm_social_associations
    domain: community_culture
    label: Membership associations per 10,000
    source: chr_rwjf
    geo_level: county
    curve: higher_better
    direction: universal
    unit: per10k

  # ---------------- sensitive (weight 0 until opted in) ----------------
  - id: sens_partisan_lean
    domain: sensitive
    label: Two-party presidential vote margin, most recent cycle
    source: countypres_mirror
    geo_level: county
    curve: ideal_point
    direction: personal
    curve_params: {target: 0, tol: 100}
    unit: margin_pct
    sensitive: true
    provisional: true
    notes: >
      Direction-neutral by design. Stored as a signed margin; the household's own curve
      decides whether high, low, or balanced scores well. The registry assumes nothing.
    quality_note: >
      Mirror of MIT Election Lab doi:10.7910/DVN/VOQCHQ, which Harvard Dataverse serves
      only behind a guestbook form. Alaska is excluded: it reports by State House
      District, and three of those pseudo-FIPS collide with real borough codes -- 02020
      is Anchorage Municipality and House District 20 at once.


  - id: sens_religious_adherence
    domain: sensitive
    label: Religious adherents as share of population
    source: usreligioncensus
    geo_level: county
    curve: ideal_point
    direction: personal
    curve_params: {target: 0.5, tol: 1.0}
    unit: share
    sensitive: true
    provisional: true
    quality_note: >
      Adherents are counted where a congregation sits, not where members live, so 30 rural
      counties reported over 100% and were dropped rather than clipped. Measures
      affiliation, not observance.


  - id: sens_foreign_born_share
    domain: sensitive
    label: Foreign-born share of population
    source: census_acs5
    geo_level: place
    curve: ideal_point
    direction: personal
    curve_params: {target: 0.10, tol: 1.0}
    unit: share
    sensitive: true
    provisional: true
