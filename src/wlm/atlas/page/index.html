<title>Wilinski Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a radar console in three bays — places on the left, the live scope in the middle,
   the readout on the right. Below 1100px the scope sits on top and the bays become tabs.
   Deliberately one dark world: a lit map reads as an instrument, not a document. */
:root {
  color-scheme: dark;
  --void: #050912;
  --panel: #0a1120;
  --panel-2: #0f1a2e;
  --line: #1b2a44;
  --line-2: #284064;
  --ink: #dce8f5;
  --dim: #8195b0;
  --signal: #62e3ff;
  --pick: #ffb454;
  --rival: #b49bff;
  --home: #f4f7fb;
  --ok: #45e0a0;
  --over: #ff6b7a;
  --unk: #8a97ab;
  --fit0: #0d1b31; --fit1: #133f5c; --fit2: #1b7895; --fit3: #3fc3e0; --fit4: #d9f9ff;
  --display: "Oxanium", "Barlow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --data: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --left: 320px; --right: 384px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--void); color: var(--ink); font: 400 15px/1.45 var(--body); overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

.app {
  height: 100%; display: grid;
  grid-template-columns: var(--left) minmax(0, 1fr) var(--right);
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "bar bar bar" "left scope right";
}

/* ---------- top bar ---------- */
.bar { grid-area: bar; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--panel); position: relative; z-index: 5; }
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.brand b { font: 700 17px/1 var(--display); letter-spacing: .16em; color: var(--ink); white-space: nowrap; }
.brand b i { font-style: normal; color: var(--signal); }
.brand span { font: 400 12px/1.2 var(--data); color: var(--dim); letter-spacing: .02em; }
.search { position: relative; flex: 1 1 260px; max-width: 460px; margin-left: auto; }
.search input { width: 100%; background: var(--void); border: 1px solid var(--line-2); border-radius: 6px; padding: 8px 12px; }
.search input::placeholder { color: var(--dim); }
.search ul { position: absolute; top: calc(100% + 4px); left: 0; right: 0; margin: 0; padding: 4px; list-style: none;
  background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 6px; z-index: 30; max-height: 320px; overflow: auto; }
.search li button { all: unset; display: flex; width: 100%; box-sizing: border-box; justify-content: space-between; gap: 12px; padding: 7px 10px; border-radius: 4px; cursor: pointer; }
.search li button:hover, .search li button:focus-visible { background: var(--line); }
.search li small { color: var(--dim); font: 12px var(--data); }
.sync { font: 12px var(--data); color: var(--dim); white-space: nowrap; }
.sync b { color: var(--ok); font-weight: 500; }
.sync b.local { color: var(--pick); }

/* ---------- side bays ---------- */
.pane { min-height: 0; overflow: auto; background: var(--panel); scrollbar-color: var(--line-2) transparent; }
.left { grid-area: left; border-right: 1px solid var(--line); }
.right { grid-area: right; border-left: 1px solid var(--line); }
.pane-inner { padding: 16px; display: flex; flex-direction: column; gap: 20px; }
.tabs { display: flex; gap: 4px; padding: 10px 16px 0; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 2; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 10px; color: var(--dim);
  font: 600 12px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; }
.tabs button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--signal); }
.eyebrow { font: 600 11px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin: 0 0 10px; display: flex; justify-content: space-between; gap: 8px; }
.eyebrow em { font: 400 11px var(--data); letter-spacing: 0; text-transform: none; font-style: normal; }
h2 { font: 600 22px/1.15 var(--display); letter-spacing: .02em; margin: 0; text-wrap: balance; }
h3 { font: 600 12px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin: 0 0 10px; }
p { margin: 0; }
.muted { color: var(--dim); }
.small { font-size: 13px; }
.num { font-family: var(--data); font-variant-numeric: tabular-nums; }

/* place cards */
.cards { display: flex; flex-direction: column; gap: 8px; }
.card { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center;
  padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); cursor: pointer; }
.card:hover, .card:focus-visible { border-color: var(--line-2); }
.card[aria-current="true"] { border-color: var(--signal); box-shadow: inset 0 0 0 1px var(--signal); }
.card .dot { width: 10px; height: 10px; border-radius: 50%; grid-row: span 2; }
.card .t { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .s { grid-column: 2 / 4; font: 12px/1.35 var(--data); color: var(--dim); min-width: 0; }
.card .score { font: 600 18px/1 var(--display); text-align: right; }
.dot.pick { background: var(--pick); box-shadow: 0 0 10px var(--pick); }
.dot.rival { background: var(--rival); box-shadow: 0 0 10px var(--rival); }
.dot.home { background: var(--home); border-radius: 2px; transform: rotate(45deg) scale(.85); }
.dot.mine { background: var(--signal); box-shadow: 0 0 10px var(--signal); }

.pill { display: inline-flex; align-items: center; gap: 6px; font: 500 12px/1 var(--data); padding: 4px 7px; border-radius: 4px; white-space: nowrap; border: 1px solid currentColor; }
.pill.ok { color: var(--ok); }
.pill.over { color: var(--over); }
.pill.unk { color: var(--unk); }

.empty { border: 1px dashed var(--line-2); border-radius: 8px; padding: 12px; color: var(--dim); font-size: 13px; }

/* weights */
.weights { display: flex; flex-direction: column; gap: 14px; }
.w-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; }
.w-row label { font-weight: 600; }
.w-row output { font: 500 14px var(--data); text-align: right; font-variant-numeric: tabular-nums; }
.w-row input[type=range] { grid-column: 1 / 3; width: 100%; accent-color: var(--signal); }
.w-row p { grid-column: 1 / 3; font-size: 12px; color: var(--dim); }
.w-row.zero label { color: var(--dim); }
.total { display: flex; justify-content: space-between; align-items: baseline; font: 13px var(--data); color: var(--dim); padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
.total b { font: 600 18px var(--display); color: var(--ink); }
.field { display: grid; gap: 6px; }
.field input[type=number] { background: var(--void); border: 1px solid var(--line-2); border-radius: 6px; padding: 8px 10px; width: 100%; font-family: var(--data); }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--dim); }
.check input { accent-color: var(--signal); margin-top: 3px; }
.btn { background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 6px; padding: 8px 12px; font: 600 12px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; }
.btn:hover { border-color: var(--signal); }
.btn.primary { background: var(--signal); color: var(--void); border-color: var(--signal); }
.btn.danger:hover { border-color: var(--over); color: var(--over); }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- the scope ---------- */
.scope { grid-area: scope; position: relative; min-width: 0; min-height: 0; overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 45%, rgba(98, 227, 255, .07), transparent 62%),
    repeating-linear-gradient(0deg, rgba(40, 64, 100, .18) 0 1px, transparent 1px 48px),
    repeating-linear-gradient(90deg, rgba(40, 64, 100, .18) 0 1px, transparent 1px 48px),
    var(--void); }
#map { width: 100%; height: 100%; display: block; touch-action: none; }
#map path { vector-effect: non-scaling-stroke; }
.c-us { stroke: rgba(5, 9, 18, .55); stroke-width: .4; cursor: pointer; transition: opacity .3s; }
.c-us:hover { stroke: var(--signal); stroke-width: 1.2; }
.st-us { fill: none; stroke: rgba(98, 227, 255, .55); stroke-width: .9; pointer-events: none; }
.zoomed .c-us { opacity: .14; }
.rc { fill: none; stroke: rgba(130, 160, 200, .45); stroke-width: .8; stroke-dasharray: 3 3; pointer-events: none; }
.rz { stroke: rgba(5, 9, 18, .6); stroke-width: .5; pointer-events: none; }
.rt { stroke: rgba(220, 240, 255, .55); stroke-width: .7; cursor: pointer; }
.rt.out { opacity: .38; }
.rt:hover { stroke: var(--home); stroke-width: 1.6; }
.rt.sel { stroke: var(--home); stroke-width: 2.4; filter: drop-shadow(0 0 6px var(--signal)); }
.ring { fill: rgba(98, 227, 255, .03); stroke: var(--signal); stroke-width: 1.3; stroke-dasharray: 6 5; pointer-events: none; animation: crawl 14s linear infinite; }
@keyframes crawl { to { stroke-dashoffset: -220; } }
.pin { cursor: pointer; }
.pin .halo { fill: none; stroke-width: 1.5; opacity: .9; animation: pulse 2.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
.pin .core { stroke: var(--void); stroke-width: 1.5; }
.pin.flip text { text-anchor: end; }
.pin text { font: 600 11px var(--display); letter-spacing: .06em; fill: var(--ink); paint-order: stroke; stroke: var(--void); stroke-width: 3px; pointer-events: none; }
.pin.pick .core { fill: var(--pick); } .pin.pick .halo { stroke: var(--pick); }
.pin.rival .core { fill: var(--rival); } .pin.rival .halo { stroke: var(--rival); }
.pin.mine .core { fill: var(--signal); } .pin.mine .halo { stroke: var(--signal); }
.pin.home .core { fill: var(--home); }
.pin.home .halo { display: none; }
@keyframes pulse { 0% { transform: scale(.6); opacity: .95; } 100% { transform: scale(2.2); opacity: 0; } }
.lbl text { font: 600 11px var(--body); fill: var(--ink); paint-order: stroke; stroke: rgba(5, 9, 18, .9); stroke-width: 3.5px; pointer-events: none; }
.lbl text tspan.sc { font-family: var(--data); font-weight: 500; fill: var(--signal); }

.hud { position: absolute; z-index: 3; font: 11px/1.4 var(--data); color: var(--dim); letter-spacing: .04em; pointer-events: none; }
.hud.tl { top: 10px; left: 12px; text-transform: uppercase; background: rgba(10, 17, 32, .82); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; max-width: calc(100% - 300px); }
.hud.tl b { color: var(--signal); font-weight: 500; }
.hud.br { bottom: 10px; right: 12px; }
.hud.bl { bottom: 10px; left: 12px; pointer-events: auto; background: rgba(10, 17, 32, .82); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-width: 200px; }
.hud.tr { top: 10px; right: 12px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; pointer-events: auto; max-width: calc(100% - 24px); }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 6px; overflow: hidden; background: rgba(10, 17, 32, .85); }
.seg button { background: none; border: 0; padding: 6px 10px; font: 600 11px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.seg button[aria-pressed="true"] { background: var(--line); color: var(--ink); }
.ramp { height: 8px; border-radius: 2px; margin: 6px 0 3px; }
.ramp-l { display: flex; justify-content: space-between; }
.legend-keys { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.legend-keys span { display: inline-flex; align-items: center; gap: 5px; }
.legend-keys i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.tip { position: absolute; z-index: 6; pointer-events: none; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 6px; padding: 7px 9px; font: 12px/1.4 var(--data); color: var(--ink); max-width: 240px; }
.tip b { font: 600 13px var(--body); display: block; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font: 600 12px var(--display); letter-spacing: .2em; text-transform: uppercase; color: var(--signal); background: var(--void); z-index: 8; }

/* ---------- readout ---------- */
.readout-head { display: grid; gap: 6px; }
.readout-head .meta { font: 12px/1.4 var(--data); color: var(--dim); }
.fitbox { display: grid; grid-template-columns: auto 1fr; gap: 0 14px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); }
.fitbox .big { font: 700 44px/1 var(--display); grid-row: span 2; }
.fitbox .lab { font: 600 11px var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.fitbox .rank { font: 13px var(--data); }
.status { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.status button { background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 6px; padding: 8px 4px; font: 600 11px/1.15 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
.status button[aria-pressed="true"] { color: var(--void); }
.status button[data-s="want"][aria-pressed="true"] { background: var(--signal); border-color: var(--signal); }
.status button[data-s="visited"][aria-pressed="true"] { background: var(--ok); border-color: var(--ok); }
.status button[data-s="favorite"][aria-pressed="true"] { background: var(--pick); border-color: var(--pick); }
.status button[data-s="ruled-out"][aria-pressed="true"] { background: var(--over); border-color: var(--over); }
textarea { width: 100%; min-height: 84px; resize: vertical; background: var(--void); border: 1px solid var(--line-2); border-radius: 6px; padding: 9px 11px; }
.bars { display: grid; gap: 7px; }
.bar-row { display: grid; grid-template-columns: 128px minmax(0, 1fr) 34px; gap: 10px; align-items: center; font-size: 13px; }
.bar-row .track { height: 8px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar-row .track i { display: block; height: 100%; border-radius: 2px; }
.bar-row .v { font: 12px var(--data); text-align: right; color: var(--dim); }
.bar-row.off { opacity: .45; }
.facts { width: 100%; border-collapse: collapse; font-size: 13px; }
.facts td { padding: 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.facts td:last-child { text-align: right; font-family: var(--data); white-space: nowrap; padding-left: 10px; }
.facts tr.grp td { color: var(--dim); font: 600 11px var(--display); letter-spacing: .12em; text-transform: uppercase; padding-top: 12px; border-bottom-color: var(--line-2); }
.facts .lvl { font: 10px var(--data); color: var(--dim); margin-left: 4px; }
.towns { width: 100%; border-collapse: collapse; font-size: 13px; }
.towns th { text-align: left; font: 600 10px var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); padding: 0 0 6px; }
.towns td { padding: 6px 0; border-top: 1px solid var(--line); }
.towns td.r { text-align: right; font-family: var(--data); white-space: nowrap; }
.towns tr { cursor: pointer; }
.towns tr:hover td { background: rgba(98, 227, 255, .05); }
.towns .chip { display: inline-block; min-width: 30px; text-align: center; font: 600 12px/1 var(--display); padding: 4px 5px; border-radius: 3px; color: var(--void); }
.towns .st { font-size: 11px; margin-left: 6px; }
.src { font-size: 12px; color: var(--dim); }
.src a { color: var(--signal); }
.cmp { width: 100%; border-collapse: collapse; font-size: 13px; }
.cmp th { text-align: left; font: 600 10px var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); padding-bottom: 6px; }
.cmp td { padding: 7px 0; border-top: 1px solid var(--line); }
.cmp td.r, .cmp th.r { text-align: right; font-family: var(--data); }
.note-saved { font: 11px var(--data); color: var(--dim); }
.mtabs { display: none; }

@media (max-width: 1100px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 56vh auto auto;
    grid-template-areas: "bar" "scope" "mtabs" "pane"; }
  .scope { height: min(56vh, calc(78vw + 80px)); }
  .left, .right { grid-area: pane; border: 0; overflow: visible; }
  .mtabs { grid-area: mtabs; display: flex; gap: 4px; background: var(--panel); border-bottom: 1px solid var(--line);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 6px 0;
    position: sticky; top: 0; z-index: 4; }
  .mtabs button { flex: 1; background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 6px; color: var(--dim);
    font: 600 12px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; }
  .mtabs button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--signal); }
  .left .tabs { display: none; }
  body:not(.m-places):not(.m-weights) .left { display: none; }
  body:not(.m-detail) .right { display: none; }
  .pane-inner { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 32px; }
  .hud.bl { display: none; }
  .brand span { display: none; }
}
@media (max-width: 480px) {
  .hud.tl { top: 48px; max-width: calc(100% - 24px); }
  .bar-row { grid-template-columns: 104px minmax(0, 1fr) 30px; }
}
@media (prefers-reduced-motion: reduce) {
  .ring, .pin .halo { animation: none; }
}
</style>

<div class="app" id="app">
  <header class="bar">
    <div class="brand"><b>WILINSKI <i>ATLAS</i></b><span>Location Machine · exploring to Sep 2027</span></div>
    <div class="search" role="search">
      <input id="search" type="search" placeholder="Add a place: town or county" autocomplete="off" aria-label="Find a town or county" aria-controls="search-results">
      <ul id="search-results" hidden></ul>
    </div>
    <div class="sync" id="sync">Connecting…</div>
  </header>

  <nav class="mtabs" aria-label="Panels">
    <button type="button" data-m="places" aria-pressed="true">Places</button>
    <button type="button" data-m="detail" aria-pressed="false">Details</button>
    <button type="button" data-m="weights" aria-pressed="false">Weights</button>
  </nav>

  <aside class="pane left" id="pane-left">
    <nav class="tabs" aria-label="Left panel">
      <button type="button" data-tab="places" aria-pressed="true">Places</button>
      <button type="button" data-tab="weights" aria-pressed="false">Weights</button>
    </nav>
    <div class="pane-inner" id="tab-places"></div>
    <div class="pane-inner" id="tab-weights" hidden></div>
  </aside>

  <main class="scope" id="scope">
    <svg id="map" role="img" aria-label="Map of US counties shaded by fit, with your picked places and the machine's challengers"></svg>
    <div class="hud tl" id="hud-mode">Continental US</div>
    <div class="hud tr">
      <button type="button" class="btn" id="btn-us" hidden>All US</button>
      <div class="seg" role="group" aria-label="Color towns by">
        <button type="button" data-color="fit" aria-pressed="true">Fit</button>
        <button type="button" data-color="rent" aria-pressed="false">Rent</button>
      </div>
      <div class="seg" role="group" aria-label="ZIP rent layer">
        <button type="button" id="btn-zips" aria-pressed="false">ZIP rents</button>
      </div>
    </div>
    <div class="hud bl" id="legend"></div>
    <div class="hud br num" id="coords"></div>
    <div class="tip" id="tip" hidden></div>
    <div class="loading" id="loading">Loading 9,885 places…</div>
  </main>

  <aside class="pane right" id="pane-right">
    <div class="pane-inner" id="readout"></div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="score.js"></script>
<script src="atlas.js"></script>
