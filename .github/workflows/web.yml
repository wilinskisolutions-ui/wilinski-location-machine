# Build the data, test everything, build the website, and (on main) publish it. Runs on
# every pull request, on main, and monthly so prices stay current. The Supabase URL and
# anon key come from web/.env.production (public by design).
#
# Publishing: on main, the finished site is force-pushed as a single commit to the `site`
# branch, and Netlify (Production branch: site) publishes that branch as it is. Netlify
# never builds anything and holds no token of ours.
#
# Optional repository variable (Settings -> Secrets and variables -> Actions -> Variables):
#   VITE_DONATE_URL   "Support" link (a Stripe Payment Link)
name: web

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 3 * *"   # 06:17 UTC on the 3rd: Zillow publishes mid-month
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write   # to push the built site to the `site` branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Raw downloads (~1 GB) are cached per month: a pull request reuses them, the
      # monthly run starts a new month's cache and so fetches fresh files.
      - id: month
        run: echo "ym=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            data/raw
            !data/raw/MANIFEST.json
          key: raw-${{ steps.month.outputs.ym }}

      - name: Install the pipeline
        run: pip install -e ".[pipeline]" playwright

      # The phone-layout tests launch Playwright's own Chromium when no system copy exists.
      - name: Install Chromium for the browser tests
        run: python -m playwright install --with-deps chromium

      - name: Build the data
        run: make data universe features atlas

      - name: Python tests
        run: make validate test

      - name: Database rules (row-level security on a throwaway Postgres)
        run: web/supabase/tests/run-local.sh

      - name: Build the website
        working-directory: web
        # Only pass the donate link when it is set: an empty variable would override
        # the value in .env files with an empty string.
        run: |
          if [ -n "${{ vars.VITE_DONATE_URL }}" ]; then export VITE_DONATE_URL="${{ vars.VITE_DONATE_URL }}"; fi
          npm ci
          npm test
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/dist
          retention-days: 14

      # One commit, no history: each publish replaces the last, so the branch never grows.
      - name: Publish the site branch
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          site="$RUNNER_TEMP/site"
          cp -r web/dist "$site"
          cp web/netlify.site.toml "$site/netlify.toml"
          cd "$site"
          git init -q -b site
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Site built from ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
